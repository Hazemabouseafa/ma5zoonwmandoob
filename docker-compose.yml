services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alwaseet2026password}
      POSTGRES_DB: ${POSTGRES_DB:-al_waseet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-al_waseet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - al_waseet_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-alwaseet2026password}@db:5432/${POSTGRES_DB:-al_waseet}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-al-waseet-super-secure-production-key-2026-b2b-dist}
    expose:
      - "3000"
    volumes:
      - app_data:/app/data
    networks:
      - al_waseet_net

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

networks:
  al_waseet_net:
    driver: bridge
